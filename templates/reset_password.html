{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <div class="glass-card login-card">
        <div class="text-center">
            <i class='bx bxs-key' style="font-size: 4rem; color: var(--primary);"></i>
            <h2>Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Enter your new password below</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="margin-bottom: 1rem; padding: 0.8rem; border-radius: 8px; background: rgba(255,255,255,0.1); border-left: 4px solid var(--primary);">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" class="premium-input" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="premium-input" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
