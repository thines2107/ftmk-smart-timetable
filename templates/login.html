{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <div class="glass-card login-card">
        <div class="text-center">
            <i class='bx bxs-user-circle' style="font-size: 4rem; color: var(--primary);"></i>
            <h2>System Login</h2>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-error">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/" autocomplete="off">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="premium-input" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="premium-input" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
            <div style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                <a href="/forgot_password" style="color: var(--primary); text-decoration: none;">Forgot Password?</a><br><br>
                Don't have an account? <a href="/register" style="color: var(--primary); font-weight: bold; text-decoration: none;">Sign Up</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
