<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agile Methodology Diagram</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: white; font-family: 'Inter', sans-serif; padding: 30px; }
    h2 { text-align: center; font-size: 20px; font-weight: 700; color: #000; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 20px; }
    .dia { display: flex; justify-content: center; }
    .foot { text-align: center; margin-top: 14px; font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <h2>Agile Methodology Diagram</h2>
  <p class="sub">FTMK Smart Timetable Arrangement System &nbsp;|&nbsp; BITU 3973 Final Year Project I</p>
  <div class="dia">
  <svg viewBox="0 0 1150 570" width="1150" height="570"
       xmlns="http://www.w3.org/2000/svg"
       style="font-family:'Inter',sans-serif;">

    <defs>
      <!-- Right arrowhead -->
      <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
      </marker>
      <!-- Left arrowhead (for return loop) -->
      <marker id="arr-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
        <polygon points="10 0, 0 3.5, 10 7" fill="#000"/>
      </marker>
    </defs>

    <!-- Background -->
    <rect width="1150" height="570" fill="white"/>

    <!-- ═══════════════════════════════════ -->
    <!-- PHASE BOXES                         -->
    <!-- ═══════════════════════════════════ -->

    <!-- PHASE 1 — Planning (x=55) -->
    <!-- Header -->
    <rect x="55" y="20" width="190" height="50" fill="#000" rx="6"/>
    <text x="150" y="38" text-anchor="middle" font-size="10" fill="white" font-weight="700">PHASE 1</text>
    <text x="150" y="57" text-anchor="middle" font-size="13" fill="white" font-weight="700">Planning</text>
    <!-- Body -->
    <rect x="55" y="70" width="190" height="390" fill="white" stroke="#000" stroke-width="1.5" rx="0"/>
    <!-- Content -->
    <text x="68" y="100" font-size="11.5" fill="#000" font-weight="700">Key Activities:</text>
    <text x="68" y="122" font-size="11" fill="#000">&#x25A0; Define project scope</text>
    <text x="68" y="140" font-size="11" fill="#000">  &amp; objectives</text>
    <text x="68" y="162" font-size="11" fill="#000">&#x25A0; Identify &amp; prioritize</text>
    <text x="68" y="180" font-size="11" fill="#000">  system features</text>
    <text x="68" y="202" font-size="11" fill="#000">&#x25A0; Select development</text>
    <text x="68" y="220" font-size="11" fill="#000">  tools &amp; technologies</text>
    <text x="68" y="242" font-size="11" fill="#000">&#x25A0; Establish project</text>
    <text x="68" y="260" font-size="11" fill="#000">  timeline</text>
    <!-- Deliverables -->
    <line x1="68" y1="285" x2="232" y2="285" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="68" y="303" font-size="11" fill="#000" font-weight="700">Deliverables:</text>
    <text x="68" y="320" font-size="10.5" fill="#333">&#x25CB; Project proposal</text>
    <text x="68" y="337" font-size="10.5" fill="#333">&#x25CB; Feature backlog</text>
    <text x="68" y="354" font-size="10.5" fill="#333">&#x25CB; Development plan</text>

    <!-- Arrow 1 → 2 -->
    <line x1="246" y1="245" x2="273" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arr-r)"/>

    <!-- PHASE 2 — Analysis (x=275) -->
    <rect x="275" y="20" width="190" height="50" fill="#000" rx="6"/>
    <text x="370" y="38" text-anchor="middle" font-size="10" fill="white" font-weight="700">PHASE 2</text>
    <text x="370" y="57" text-anchor="middle" font-size="13" fill="white" font-weight="700">Analysis</text>
    <rect x="275" y="70" width="190" height="390" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="288" y="100" font-size="11.5" fill="#000" font-weight="700">Key Activities:</text>
    <text x="288" y="122" font-size="11" fill="#000">&#x25A0; Investigate current</text>
    <text x="288" y="140" font-size="11" fill="#000">  timetable process</text>
    <text x="288" y="162" font-size="11" fill="#000">&#x25A0; Document functional</text>
    <text x="288" y="180" font-size="11" fill="#000">  &amp; non-functional req.</text>
    <text x="288" y="202" font-size="11" fill="#000">&#x25A0; Analyze existing</text>
    <text x="288" y="220" font-size="11" fill="#000">  systems</text>
    <text x="288" y="242" font-size="11" fill="#000">&#x25A0; Conduct literature</text>
    <text x="288" y="260" font-size="11" fill="#000">  review</text>
    <line x1="288" y1="285" x2="452" y2="285" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="288" y="303" font-size="11" fill="#000" font-weight="700">Deliverables:</text>
    <text x="288" y="320" font-size="10.5" fill="#333">&#x25CB; Requirements doc</text>
    <text x="288" y="337" font-size="10.5" fill="#333">&#x25CB; Literature review</text>
    <text x="288" y="354" font-size="10.5" fill="#333">&#x25CB; System analysis</text>

    <!-- Arrow 2 → 3 -->
    <line x1="466" y1="245" x2="493" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arr-r)"/>

    <!-- PHASE 3 — Design (x=495) -->
    <rect x="495" y="20" width="190" height="50" fill="#000" rx="6"/>
    <text x="590" y="38" text-anchor="middle" font-size="10" fill="white" font-weight="700">PHASE 3</text>
    <text x="590" y="57" text-anchor="middle" font-size="13" fill="white" font-weight="700">Design</text>
    <rect x="495" y="70" width="190" height="390" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="508" y="100" font-size="11.5" fill="#000" font-weight="700">Key Activities:</text>
    <text x="508" y="122" font-size="11" fill="#000">&#x25A0; System architecture</text>
    <text x="508" y="140" font-size="11" fill="#000">  design (3-tier)</text>
    <text x="508" y="162" font-size="11" fill="#000">&#x25A0; Database &amp; UI design</text>
    <text x="508" y="182" font-size="11" fill="#000">&#x25A0; Algorithm design</text>
    <text x="508" y="200" font-size="11" fill="#000">  (conflict-free scheduling)</text>
    <text x="508" y="222" font-size="11" fill="#000">&#x25A0; PDF extraction</text>
    <text x="508" y="240" font-size="11" fill="#000">  logic specification</text>
    <line x1="508" y1="285" x2="672" y2="285" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="508" y="303" font-size="11" fill="#000" font-weight="700">Deliverables:</text>
    <text x="508" y="320" font-size="10.5" fill="#333">&#x25CB; ER diagram</text>
    <text x="508" y="337" font-size="10.5" fill="#333">&#x25CB; Use case &amp; UML diagrams</text>
    <text x="508" y="354" font-size="10.5" fill="#333">&#x25CB; UI wireframes</text>

    <!-- Arrow 3 → 4 -->
    <line x1="686" y1="245" x2="713" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arr-r)"/>

    <!-- PHASE 4 — Development (x=715) -->
    <rect x="715" y="20" width="190" height="50" fill="#000" rx="6"/>
    <text x="810" y="38" text-anchor="middle" font-size="10" fill="white" font-weight="700">PHASE 4</text>
    <text x="810" y="57" text-anchor="middle" font-size="13" fill="white" font-weight="700">Development</text>
    <rect x="715" y="70" width="190" height="390" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="728" y="100" font-size="11.5" fill="#000" font-weight="700">Key Activities:</text>
    <text x="728" y="122" font-size="11" fill="#000">&#x25A0; Iterative feature</text>
    <text x="728" y="140" font-size="11" fill="#000">  implementation</text>
    <text x="728" y="162" font-size="11" fill="#000">&#x25A0; Flask/Python backend</text>
    <text x="728" y="182" font-size="11" fill="#000">&#x25A0; HTML/CSS/JS frontend</text>
    <text x="728" y="202" font-size="11" fill="#000">&#x25A0; Relational database</text>
    <text x="728" y="222" font-size="11" fill="#000">  implementation</text>
    <text x="728" y="242" font-size="11" fill="#000">&#x25A0; PDF extraction</text>
    <text x="728" y="260" font-size="11" fill="#000">  (pdfplumber)</text>
    <line x1="728" y1="285" x2="892" y2="285" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="728" y="303" font-size="11" fill="#000" font-weight="700">Deliverables:</text>
    <text x="728" y="320" font-size="10.5" fill="#333">&#x25CB; Working system modules</text>
    <text x="728" y="337" font-size="10.5" fill="#333">&#x25CB; Source code</text>
    <text x="728" y="354" font-size="10.5" fill="#333">&#x25CB; Database schema</text>

    <!-- Arrow 4 → 5 -->
    <line x1="906" y1="245" x2="933" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arr-r)"/>

    <!-- PHASE 5 — Testing (x=935) -->
    <rect x="935" y="20" width="190" height="50" fill="#000" rx="6"/>
    <text x="1030" y="38" text-anchor="middle" font-size="10" fill="white" font-weight="700">PHASE 5</text>
    <text x="1030" y="57" text-anchor="middle" font-size="13" fill="white" font-weight="700">Testing</text>
    <rect x="935" y="70" width="190" height="390" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="948" y="100" font-size="11.5" fill="#000" font-weight="700">Key Activities:</text>
    <text x="948" y="122" font-size="11" fill="#000">&#x25A0; Functional testing</text>
    <text x="948" y="140" font-size="11" fill="#000">  per module</text>
    <text x="948" y="162" font-size="11" fill="#000">&#x25A0; User acceptance</text>
    <text x="948" y="180" font-size="11" fill="#000">  testing (UAT)</text>
    <text x="948" y="202" font-size="11" fill="#000">&#x25A0; Conflict detection</text>
    <text x="948" y="220" font-size="11" fill="#000">  accuracy testing</text>
    <text x="948" y="242" font-size="11" fill="#000">&#x25A0; UI usability</text>
    <text x="948" y="260" font-size="11" fill="#000">  evaluation</text>
    <line x1="948" y1="285" x2="1112" y2="285" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="948" y="303" font-size="11" fill="#000" font-weight="700">Deliverables:</text>
    <text x="948" y="320" font-size="10.5" fill="#333">&#x25CB; Test results report</text>
    <text x="948" y="337" font-size="10.5" fill="#333">&#x25CB; UAT feedback</text>
    <text x="948" y="354" font-size="10.5" fill="#333">&#x25CB; Refined system</text>

    <!-- ═══════════════════════════════════ -->
    <!-- ITERATIVE RETURN LOOP              -->
    <!-- ═══════════════════════════════════ -->

    <!-- Loop line: Phase 5 bottom → curve → Phase 1 bottom with arrow -->
    <path d="M 1030,460 Q 1030,520 575,520 Q 120,520 120,460"
          fill="none" stroke="#000" stroke-width="1.8"
          stroke-dasharray="8,4"
          marker-end="url(#arr-l)"/>

    <!-- Loop label -->
    <text x="575" y="543" text-anchor="middle" font-size="11" fill="#000" font-style="italic">
      Iterative Refinement &amp; Continuous Feedback (Sommerville, 2016)
    </text>

  </svg>
  </div>
  <p class="foot">BITU 3973 Final Year Project I &nbsp;|&nbsp; FTMK, UTEM</p>
</body>
</html>
